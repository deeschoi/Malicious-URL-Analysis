name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # scipy 1.17 requires Python 3.11+; 3.12 matches the Docker runtime.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Test
        run: pytest -m "not network" -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lint
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          ruff check .

  imports:
    # The analysis scripts and the API are not covered by unit tests end to end.
    # Importing every module catches the package-drift class of breakage, where
    # a helper is renamed in src/phishing and its callers are left behind.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Import every entry point
        run: python scripts/check_imports.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck, test, and build
        run: |
          npx tsc --noEmit
          npm test
          npm run build

  docker:
    # Trains the model as part of the build, so this also proves the pipeline
    # runs end to end on a clean checkout.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: phishing-scanner:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the container
        run: |
          docker run -d --name scanner -p 8000:8000 phishing-scanner:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health; then
              echo "healthy"; break
            fi
            if [ "$i" = "30" ]; then
              echo "API never became healthy"; docker logs scanner; exit 1
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/api/model | head -c 400
          curl -fsS http://127.0.0.1:8000/ | grep -q "Phishing URL Scanner"
          curl -fsS http://127.0.0.1:8000/history | grep -q "Phishing URL Scanner"
          docker rm -f scanner
