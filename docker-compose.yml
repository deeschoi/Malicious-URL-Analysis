services:
  api:
    build: .
    image: phishing-scanner:latest
    ports:
      - "8000:8000"
    environment:
      PHISHING_ROOT: /app
      # Set by the database phase; SQLite file by default.
      PHISHING_DATABASE_URL: ${PHISHING_DATABASE_URL:-sqlite:////app/data/scans.db}
    volumes:
      - scan-data:/app/data
    restart: unless-stopped

volumes:
  scan-data:
